[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sisyphus-loop"
version = "0.1.0"
description = "Ordinary pytest acceptance tests for sandboxed, editable recipes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pytest>=8.3,<10"]

[project.scripts]
sisyphus = "sisyphus.cli:main"

[project.entry-points.pytest11]
sisyphus = "sisyphus.plugin"

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/sisyphus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["podman: requires an explicitly selected local image and rootless Podman"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
